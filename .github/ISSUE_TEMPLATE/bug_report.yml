name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 or Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
  - type: input
    id: gpu
    attributes:
      label: GPU / CUDA status
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove private paths and identifiers.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed confidential images, serial numbers, and personal data.
          required: true

  - type: textarea
    id: accelerator
    attributes:
      label: Accelerator diagnostics
      description: Paste the complete output of scripts/check_accelerator.py.
      render: shell
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Exact GPU model
      placeholder: NVIDIA RTX 3080 / AMD Radeon RX 7900 XTX / CPU only
    validations:
      required: true
